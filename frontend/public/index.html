<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="description" content="NEU Insights — AI-powered course advisor" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NEU Insights | Your Academic Advantage</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-surface": "#e2e0fc",
              "surface-tint": "#ffb4aa",
              "on-secondary-container": "#ff9e96",
              "on-surface": "#e2e0fc",
              "error-container": "#93000a",
              "primary-container": "#ff5545",
              "error": "#ffb4ab",
              "outline": "#ad8883",
              "surface-bright": "#37374d",
              "inverse-on-surface": "#2f2e43",
              "surface-container": "#1e1e32",
              "primary-fixed": "#ffdad5",
              "tertiary-container": "#ff5546",
              "on-secondary": "#680009",
              "surface-variant": "#333348",
              "surface-container-high": "#28283d",
              "on-primary-container": "#5c0002",
              "tertiary": "#ffb4aa",
              "on-background": "#e2e0fc",
              "secondary-container": "#8f191b",
              "inverse-primary": "#c0000a",
              "on-primary": "#690003",
              "surface-container-lowest": "#0c0c1f",
              "surface-dim": "#111125",
              "primary": "#ffb4aa",
              "on-surface-variant": "#e7bdb7",
              "surface-container-low": "#1a1a2e",
              "on-error": "#690005",
              "outline-variant": "#5d3f3b",
              "surface-container-highest": "#333348",
              "secondary": "#ffb3ad",
              "surface": "#111125",
              "background": "#111125",
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"],
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .hero-glass-card {
        background: rgba(40, 40, 61, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .primary-cta {
        background: linear-gradient(135deg, #FF3B30 0%, #FF5545 100%);
      }
      .ghost-border {
        outline: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-input {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 59, 48, 0.3);
      }
      .focus-red-glow:focus-within {
        box-shadow: 0 0 15px rgba(255, 59, 48, 0.15);
        border-color: rgba(255, 59, 48, 0.3);
      }

      /* Loading screen */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1A1A2E;
        gap: 32px;
      }
      .loading-logo {
        width: 72px;
        height: 72px;
        background: #FF3B30;
        color: #fff;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 36px;
        font-family: Inter, -apple-system, sans-serif;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .loading-bar {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 3px;
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        background: #FF3B30;
        border-radius: 3px;
        animation: loadFill 1.8s ease-in-out forwards;
      }
      @keyframes loadFill {
        0% { width: 0%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }

      /* Thinking dots */
      .thinking-dots::after {
        content: '';
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }

      /* Animated gradient for hero card */
      .hero-gradient-anim {
        background: linear-gradient(
          135deg,
          rgba(255, 59, 48, 0.15) 0%,
          rgba(255, 85, 69, 0.08) 25%,
          transparent 50%,
          rgba(255, 59, 48, 0.06) 75%,
          rgba(255, 85, 69, 0.12) 100%
        );
        background-size: 300% 300%;
        animation: heroGradientShift 16s ease-in-out infinite;
      }
      @keyframes heroGradientShift {
        0% { background-position: 0% 0%; }
        25% { background-position: 100% 0%; }
        50% { background-position: 100% 100%; }
        75% { background-position: 0% 100%; }
        100% { background-position: 0% 0%; }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
